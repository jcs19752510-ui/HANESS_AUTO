# 예시 워크플로 — 그대로 쓰지 말고 프로젝트의 실제 빌드/테스트 명령, 브랜치 전략에 맞게 고칠 것.
# `run-harness-agent.sh <stage-name>` 은 존재하지 않는 플레이스홀더 스크립트다.
# 이 프로젝트에서 실제로 각 단계를 무엇으로 실행할지(Claude Code CLI 헤드리스 실행,
# 또는 각 언어별 테스트/린트/보안스캐너를 직접 호출하는 스크립트 등)를 팀이 채워 넣어야 한다.

name: harness-pipeline

on:
  push:
    branches: ["feature/**"]     # work unit / feature 브랜치
  pull_request:
    branches: ["develop", "main"]
  release:
    types: [created]

jobs:
  unit-and-integration:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "6단계 - 단위테스트"
        run: ./automation/run-harness-agent.sh 06-unit-tester
      - name: "7단계 - 업무단위 통합테스트 (feature 브랜치 병합 시)"
        if: github.event_name == 'pull_request'
        run: ./automation/run-harness-agent.sh 07-integration-tester

  full-system-and-security:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    needs: [unit-and-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "8단계 - 전체 풀테스트 (+ UAT 섹션)"
        run: ./automation/run-harness-agent.sh 08-full-system-tester
      - name: "9단계 - 보안검증"
        run: ./automation/run-harness-agent.sh 09-security-auditor

  deploy-test:
    needs: [full-system-and-security]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "10단계 - 배포테스트 (스테이징)"
        run: ./automation/run-harness-agent.sh 10-deploy-tester

  deploy:
    needs: [deploy-test]
    runs-on: ubuntu-latest
    # 핵심: 이 environment에 GitHub의 "Required reviewers" 보호 규칙을 걸어야
    # 사람의 명시적 승인 없이는 아래 step이 절대 실행되지 않는다 (규칙 E).
    environment:
      name: production-deploy-approval
    steps:
      - uses: actions/checkout@v4
      - name: "11단계 - 실제 배포 (승인된 경우에만 도달)"
        run: ./automation/run-harness-agent.sh 11-deployer

  post-deploy-verify:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "12단계 - 배포후 검증"
        run: ./automation/run-harness-agent.sh 12-post-deploy-verifier
